<div class="container d-flex justify-content-center align-items-center  bg-light">
  <div class="card shadow p-4">
    <div class="text-center mb-4">
      <i class="fa fa-user-circle fa-3x text-primary"></i>
      <h4 class="mt-2">Admin Login</h4>
    </div>
    <form>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-user"></i></span>
          <input type="text" class="form-control" id="username" [(ngModel)]="loginObj.userName" name="username" placeholder="Enter username" autocomplete="username">
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa fa-lock"></i></span>
          <input type="password" class="form-control" id="password" [(ngModel)]="loginObj.password" name="password" placeholder="Enter password" autocomplete="current-password">
        </div>
      </div>
      <button type="button" (click)="onLogin()" class="btn btn-primary w-100 login-button">Login</button>
      <div class="text-center mt-3">
        <a href="#" class="forgot-password-link">Forgot Password?</a>
      </div>
    </form>
  </div>
</div>
